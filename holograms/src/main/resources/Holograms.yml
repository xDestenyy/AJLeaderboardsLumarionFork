leaderboards:
  enabled: true
  render-interval-seconds: 5
  data-refresh-seconds: 30
  view-distance: 48.0
  default-size: 10
  max-size: 15
  default-cycle-seconds: 10
  display:
    scale: 1.0
    billboard: CENTER
    alignment: CENTER
    line-width: 240
    background: "#0B0B14"
    background-alpha: 150
    shadow: true
    see-through: false
    text-opacity: 255
  head:
    enabled: true
    scale: 0.8
    height: 0.55
    line-height: 0.25
    yaw-offset: 180.0
  colors:
    ranks: [ "#FACC15", "#E5E7EB", "#FB923C" ]
    default: "#9CA3AF"
  format:
    layout:
      - "<gradient:#8B5CF6:#22D3EE><bold><title></bold></gradient>"
      - "<dim>Top <size> <dark_gray>·</dark_gray> aktualisiert vor <updated>"
      - "<dark_gray><strikethrough>                                  </strikethrough>"
      - "<entries>"
      - "<dark_gray><strikethrough>                                  </strikethrough>"
      - "<pages>"
    entry: "<color:<color>><bold><rank>.</bold> <white><name> <dark_gray>»</dark_gray> <color:<color>><value>"
    entry-ranks:
      1: "<color:<color>><bold>♛ <rank>.</bold> <white><bold><name></bold> <dark_gray>»</dark_gray> <color:<color>><bold><value></bold>"
    empty: "<dark_gray><rank>. <dim>— frei —"
    waiting: "<mute>Bestenliste wird geladen<dim><dots>"
    page-active: "<hi>●</hi>"
    page-inactive: "<dark_gray>○</dark_gray>"
  titles:
    statistic_player_kills: "Kills"
    statistic_deaths: "Tode"
    "statistic_player_kills:weekly": "Kills · Woche"
